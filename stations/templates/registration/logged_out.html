{% extends 'base.html' %}

{% block title %}Déconnexion - Carbura{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center">
        <!-- Success Icon -->
        <div class="mx-auto w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4">
            <i class="fas fa-check-circle text-3xl text-green-600"></i>
        </div>

        <!-- Message -->
        <h2 class="text-3xl font-bold text-gray-900 mb-4">Déconnexion réussie</h2>
        <p class="text-lg text-gray-600 mb-8">
            Vous avez été déconnecté avec succès de votre compte Carbura.
        </p>

        <!-- Actions -->
        <div class="space-y-4">
            <a href="{% url 'login' %}" 
               class="w-full inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 transition duration-200">
                <i class="fas fa-sign-in-alt mr-2"></i>
                Se reconnecter
            </a>
            
            <a href="{% url 'home' %}" 
               class="w-full inline-flex justify-center items-center px-6 py-3 border border-gray-300 text-base font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition duration-200">
                <i class="fas fa-home mr-2"></i>
                Retour à l'accueil
            </a>
        </div>

        <!-- Thank You Message -->
        <div class="mt-8 bg-blue-50 border border-blue-200 rounded-xl p-4">
            <p class="text-blue-800 text-sm">
                <i class="fas fa-heart text-red-400 mr-1"></i>
                Merci d'avoir contribué à la communauté Carbura !
            </p>
        </div>
    </div>
</div>
{% endblock %}
